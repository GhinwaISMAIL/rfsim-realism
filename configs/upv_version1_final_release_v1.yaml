name: upv_version1_final_release_v1
stage: version1_final_supported_kpi_emulator_release
release_status: final_supported_version1_kpi_level_emulator
objective: >-
  Freeze the deterministic measurement-driven RFsim Version 1 emulator,
  consolidate its development and held-out exploratory evidence, and publish
  reproducible figures, metrics, claim limits, and artifact provenance.

runtime_model:
  target: synchronized_relative_rsrp_and_device_conditioned_sinr
  translator: bounded_piecewise_affine_interpolation
  channel_family: AWGN
  controls: [scalar_gain_db, effective_noise_power_db]
  command_interval_seconds: 1.0
  extrapolation: prohibited
  clipping: nearest_validated_hull_boundary
  online_adaptation: prohibited
  dynamic_compensation: prohibited

evidence_roles:
  test1: complete_trace_development_fidelity_and_three_execution_repeatability
  test6: posthoc_held_out_exploratory_replay_not_confirmatory_validation
