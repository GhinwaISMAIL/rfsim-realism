schema_version: 1
name: upv_tdl_b_existing_bank_support_v1
stage: existing_bank_support_diagnostic_only
phase1_protocol:
  revision: 242181ad8d2f0f3d6ef1e88c18fbabab6ff3b0d1
  tag: upv-protocol-v1
  primary_interpretation: timestamp_gps_corrected
  sensitivity_interpretation: original_filenames

model:
  family: TDL_B
  topology:
    gnb_count: 1
    ue_count: 1
    ue_mobility: stationary

upv_selection:
  source_path: Test_2/Test_2_ASUS.csv
  primary_bin_size_m: 15
  calibration_role: calibration
  validation_role_prefix: spatial_validation_
  required_complete_columns:
    - rsrp_dbm
    - sinr_db
    - seconds_of_day
    - longitude_deg
    - latitude_deg

scenario_interpretation_sensitivity:
  enabled: true
  status: provisional_pending_author_confirmation
  interpretation: original_filenames
  source_path: Test_1/Test_1_Asus.csv
  filename_test_id: 1
  split_rule: reuse_phase1_geometry_only_algorithm_and_thresholds
  affects_primary_scaling: false
  affects_primary_candidate_ranking: false

features:
  - name: RSRP
    order: 1
    upv_column: rsrp_dbm
    rfsim_column: ss_rsrp_dbm
    weight: 1.0
  - name: SINR
    order: 2
    upv_column: sinr_db
    rfsim_column: ss_sinr_db
    weight: 1.0

missing_value_policy: complete_case_drop_before_aggregation

temporal_aggregation:
  duration_seconds: 1.0
  statistic: median
  upv_origin: first_selected_timestamp
  rfsim_origin: fixed_analysis_window_start

rfsim_selection:
  observation_filename: ue_second_features.parquet
  execution_id_column: execution_id
  time_column: t_s
  analysis_window_start_seconds: 15.0
  analysis_window_end_seconds: 175.0
  analysis_window_end_inclusive: false
  model_column: dl_model_type
  ploss_column: dl_ploss
  noise_column: dl_noise_power_dB
  require_true:
    - channel_schedule_enabled
    - channel_state_success
    - channel_verified
  require_false:
    - channel_transition_partial
  minimum_complete_aggregated_rows: 12
  required_repetitions_per_state: 2

balanced_reference:
  sources: upv_calibration_plus_every_rfsim_execution
  rows_per_source: minimum_complete_aggregated_rows_across_sources
  row_selection: deterministic_evenly_spaced_time_index
  robust_center: median
  robust_scale: normalized_mad
  normalized_mad_factor: 1.4826
  zero_mad_fallback: iqr_divided_by_1.349

kernel:
  name: rbf
  estimator: unbiased_mmd_squared
  bandwidth_source: balanced_reference_median_heuristic
  bandwidth_formula: sqrt_median_positive_squared_distance_divided_by_2

bootstrap:
  rule: circular_moving_block_with_fixed_target_length
  block_length_aggregated_rows: 3
  repetitions: 1000
  confidence_level: 0.95
  seed: 20260824
  interpretation: traversal_conditional_not_between_execution

sensitivity:
  ploss_sweep_fixed_noise_power_dB: -30.0
  noise_sweep_fixed_ploss: 0.0
  fit_unit: execution_level_aggregated_mean
  uncertainty: fixed_grid_within_level_execution_bootstrap
  bootstrap_repetitions: 5000
  seed: 20260825
  minimum_unique_levels: 3
  no_extrapolation: true
  full_interaction_surface_claim: prohibited

support_rules:
  marginal_interval_quantiles: [0.10, 0.90]
  marginal_support_rule: closed_interval_overlap
  repeatability_threshold_quantile: 0.90
  joint_support_rule: candidate_mean_mmd_not_above_repeatability_threshold
  candidate_ranking: ascending_mean_execution_level_mmd
  boundary_rule: best_candidate_at_global_minimum_or_maximum_of_either_control
  euclidean_adjacency_threshold_m: 5.0
  minimum_independent_repetitions_for_abc: 3
  preferred_independent_repetitions_for_abc: 5

decision_rules:
  order:
    - systematic_rsrp_offset_but_sinr_support
    - closest_candidate_at_boundary
    - sequential_support_only
    - joint_support_and_local_identifiability
    - gross_joint_mismatch
  crossed_two_dimensional_design_required_for_joint_identifiability: true
  current_design_is_crossed_two_dimensional: false
  abc_is_prohibited_for_existing_bank: true
