  continuous_profile_is_retained_in_metadata: true

transport:
  selected_candidate: VRTSIM_CIRDB
  previous_provisional_candidate: VRTSIM_external_taps
  selection_reason: >-
    Runtime sample-rate evidence shows that nearest-sample discretization maps
    the complete 23-component TDL-B profile into exactly eight delay bins, so
    CIRDB can carry the full binned profile without truncation.
  cirdb_model_id: 1
  cirdb_model_mapping: 1_is_TDL-B
  binary_dtype: little_endian_complex64
  binary_layout: snapshot_link_tap
  pair_order: 0
  pinned_constraints:
    cirdb_max_published_taps: 8
    external_taps_max_taps: 100
  compatibility_rule: discretized_channel_length_must_not_exceed_cirdb_max_published_taps
  actual_replay_timing_and_drop_validation_complete: false

validation:
  finite_values_required: true
  exact_snapshot_count_required: true
  timestamp_max_abs_error_s: 1.0e-12
  small_scale_mean_power_max_abs_error: 1.0e-6
  binned_pdp_max_abs_error_db: 0.6
  discretized_rms_delay_spread_relative_error_maximum: 0.05
  acf_max_doppler_periods: 2.0
  acf_mean_abs_error_maximum: 0.12
  acf_imaginary_max_abs_maximum: 0.12
  lag_one_autocorrelation_magnitude_minimum: 0.95
  coherence_threshold: 0.5
  coherence_time_ratio_range: [0.60, 1.50]
  doppler_guard_fraction: 0.10
  doppler_in_band_power_fraction_minimum: 0.98
  doppler_99pct_edge_ratio_range: [0.75, 1.10]
  shadowing_correlation_threshold: 0.36787944117144233
  minimum_shadowing_correlation_lengths: 30.0
  shadowing_correlation_distance_ratio_range: [0.50, 1.75]
  changed_snapshot_fraction_minimum: 0.999
  binary_roundtrip_exact_required: true

source_assertions:
  - path: radio/vrtsim/cirdb_provider.c
    fact: CIRDB publishes at most eight delay-sample taps.
    snippets:
      - "#define MAX_L_PUBLISH 8"
      - "G.L_out = (m.L <= MAX_L_PUBLISH ? (uint32_t)m.L : MAX_L_PUBLISH);"
  - path: radio/vrtsim/cirdb_provider.c
    fact: CIRDB advances snapshots from elapsed sample time and the stored snapshot interval.
    snippets:
      - "double steps_f = (ns_since_start * 1e-9) / dt_s;"
      - "load_snapshot_and_publish(G, s);"
  - path: radio/vrtsim/taps_client.cpp
    fact: The alternative external-taps transport supports at most 100 delay-sample taps.
    snippets:
      - "#define MAX_TAPS_LEN 100"
  - path: radio/vrtsim/cirdb_provider.h
    fact: CIRDB model identifier one denotes TDL-B.
    snippets:
      - "1 (TDL-B)"

