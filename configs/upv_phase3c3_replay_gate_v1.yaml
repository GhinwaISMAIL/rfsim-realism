existing_image_audit:
  accepted_build_manifest_sha256: 660b82af6085cc8bd04ed6abefc091ceb16c05308f8385e0cee59c2edf197897
  audited_dockerfile_sha256: a98dfcb9b93e5ac347150e5cb1a0973becd86030afd7684c639678d6f2e273e1
  audited_build_script_sha256: 94b5823622cc2f51405a5f6b6e913c1c26c3bd32b160c9d7621c5978cdf4d548
  findings:
    - the build command requests nrUE but not gNB
    - the UE runtime image copies nr-uesoftmodem and librfsimulator but not libvrtsim
    - the gNB runtime image copies librfsimulator but not the pinned nr-softmodem or libvrtsim
  decision: existing_phase3c_debug_images_are_not_accepted_as_vrtsim_replay_images
  prohibited_assumption: image_revision_label_proves_that_every_runtime_binary_is_from_that_revision

required_vrtsim_build:
  source_revision: 70508ebaf52f2aae420566d380c6537f2efb9f0c
  required_build_targets: [gNB, nrUE]
  required_cmake_option: OAI_VRTSIM_TAPS_CLIENT=ON
  runtime_artifacts:
    gnb: [nr-softmodem, libvrtsim.so]
    ue: [nr-uesoftmodem, libvrtsim.so]
  validation:
    - image architecture must be amd64
    - image revision label must equal the full pinned OAI revision
    - every runtime artifact must exist
    - ldd must report no unresolved dependency for both binaries and libvrtsim
    - image IDs and sizes must be recorded before deployment
  build_only_gate: requires_a_separate_committed_execution_amendment

small_replay:
  purpose: transport_attachment_and_measurement_safety_test_not_calibration
  topology:
    gnb_count: 1
    ue_count: 1
    channel: virtual_VRTSIM_CIRDB
    physical_RF_or_SDR: false
  trace:
    model: TDL-B
    model_id: 1
    carrier_frequency_hz: 3319680000.0
    speed_mps: 1.5
    desired_rms_delay_spread_ns: 30.0
    snapshot_interval_s: 0.002
    snapshots_per_cycle: 150000
    cycle_duration_s: 300.0
    discrete_taps: 8
  repetitions: 2
  independent_execution_definition: separate_clean_process_start_with_the_same_pinned_trace
  per_repetition:
    attachment_timeout_s: 180.0
    post_attachment_observation_s: 330.0
    minimum_usable_telemetry_duration_s: 300.0
    traffic: one_hz_ICMP_from_UE_through_UPF_during_observation
    required_trace_cycle_coverage_fraction: 0.99
  frozen_runtime_options:
    gnb:
      - "--device.name vrtsim"
      - "--vrtsim.role server"
      - "--vrtsim.cirdb 1"
      - "--vrtsim.cirdb_model_id 1"
      - "--vrtsim.cirdb_ds_ns 30"
      - "--vrtsim.cirdb_speed_mps 1.5"
      - "--vrtsim.num_ues 1"
    ue:
      - "--device.name vrtsim"
      - "--vrtsim.role client"
      - "--ue-nb-ant-rx 1"
      - "--ue-nb-ant-tx 1"
  shared_runtime_requirements:
    - gNB and UE use host IPC
    - gNB and UE share the VRTSIM connection-descriptor volume
    - the gNB mounts the checksummed CIRDB directory read-only

acceptance_rules:
  valid_repetitions_required: 2
  attachment_fraction_required: 1.0
  minimum_usable_telemetry_duration_s: 300.0
  pbch_decode_error_count_maximum: 0
  critical_pusch_failure_count_maximum: 0
  random_access_failure_count_maximum: 0
  radio_link_failure_count_maximum: 0
  lost_sync_count_maximum: 0
  ping_packet_loss_fraction_maximum: 0.05
  gnb_and_ue_container_restart_count_maximum: 0
  gnb_health_required: healthy
  trace_cycle_coverage_fraction_minimum: 0.99
  skipped_cirdb_snapshot_fraction_maximum: 0.01
  maximum_consecutive_skipped_cirdb_snapshots: 10
  required_debug_statistics:
    - current_cirdb_snapshot_index
    - expected_cirdb_step
    - applied_cirdb_updates
    - skipped_cirdb_snapshots
    - maximum_consecutive_skipped_cirdb_snapshots
    - current_tap_energy_linear

stopping_rules:
  - stop before deployment on any checksum, image-ID, revision, binary, module, or ldd mismatch
  - stop if either process exits or either container restarts
  - stop if the UE does not attach within 180 seconds
  - stop on any attachment loss, PBCH decode error, critical PUSCH failure, RA failure, RLF, or lost-sync marker
  - stop if more than 10 consecutive CIRDB snapshots are skipped
  - stop if trace-cycle coverage cannot reach 99 percent within 330 seconds after attachment
  - do not calculate MMD, infer parameters, or compare absolute RSRP during this replay

rollback:
  mandatory: true
  runs_in_finally: true
  restore_original_compose_and_images: true
  require_UE_reattachment_after_restore: true
  require_gNB_health_after_restore: true
  require_gNB_restart_count_unchanged_after_restore: true

claim_limits:
  measured_UPV_channel_replayed: false
  speed_inferred_from_UPV: false
  environmental_realism_established: false
  transport_and_attachment_safety_only: true
  absolute_rsrp_calibration: prohibited
  abc: prohibited

reservation:
  gate_state: closed
  reservation_should_be_requested_now: false
  preparation_lead_time_minutes: 30
  blockers:
    - dedicated VRTSIM runtime image build implementation is not committed
    - CIRDB timing and skipped-snapshot telemetry is not implemented
    - the fail-closed small-replay runner is not committed
    - no Phase 3C4 build or replay execution amendment exists
  next_action: implement_and_test_the_dedicated_vrtsim_build_and_cirdb_telemetry_offline
