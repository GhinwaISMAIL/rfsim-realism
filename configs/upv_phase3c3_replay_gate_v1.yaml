    random_access_success: "4-Step RA procedure succeeded"
    rrc_connected: "State = NR_RRC_CONNECTED"
    registration_accept: "Received Registration Accept with result"
  prohibited_ue_markers:
    pbch_decode_error: "Error decoding PBCH!"
    random_access_failure: "RA Procedure failed"
    radio_link_failure: "RLF detected|radio link failure"
    lost_sync: "LOST SYNC|out of sync"
  required_gnb_markers:
    pusch_failure_threshold_configured: "PUSCH Target .* RSSI thresh .* Failure"
  prohibited_gnb_markers:
    pusch_ul_failure: "Detected UL Failure on PUSCH after"
    random_access_failure: "RA Procedure failed"
    radio_link_failure: "RLF detected|radio link failure"
  individual_ulsch_dtx_policy: report_counter_but_do_not_fail_unless_critical_threshold_marker_appears
  all_required_marker_minimum_count: 1
  all_prohibited_marker_maximum_count: 0
  missing_log_or_marker_action: fail_closed

