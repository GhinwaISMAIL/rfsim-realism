schema_version: 1
name: awgn_single_ue_calibration_v1
topology:
  cells: 1
  ues: 1
channel:
  model_type: AWGN
  direction: dl
  baseline:
    ploss: 0
    noise_power_dB: -30
experiments:
  - parameter: noise_power_dB
    values: [-30, -25, -20, -15, -10, -8, -5]
  - parameter: ploss
    values: [0, -5, -10, -15, -20, -25, -30]
timing:
  run_seconds: 180
  baseline_lead_seconds: 45
  segment_seconds: 90
  settle_seconds: 45
  measurement_seconds: 45
  baseline_tail_seconds: 45
  return_to_baseline_between_values: true
repetitions: 2
required_observations:
  - ue_rsrp_dbm
  - ue_rsrq_db
  - ue_sinr_db
  - dl_mcs
  - dl_bler
  - packet_latency_ms
  - packet_received
quality_requirements:
  verified_channel_readback: true
  utc_clock_anchor: true
  clean_xapp_shutdown: true
  source_repository_commits_recorded: true
  min_packet_clock_valid_fraction: 0.95
  max_ntp_offset_spread_ms: 5.0
  max_ntp_jitter_ms: 1.0
  max_radio_clock_lag_p95_s: 0.1
  max_ue_radio_emit_lag_p95_s: 0.5
