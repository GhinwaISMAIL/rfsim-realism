schema_version: 1
name: upv_phase3b_nonabsolute_existing_bank_support_v1
stage: existing_bank_nonabsolute_support_diagnostic_only
selected_measurement_branch: insufficient_metadata
execution_authorized: false
abc_authorized: false

frozen_inputs:
  phase1_revision: 242181ad8d2f0f3d6ef1e88c18fbabab6ff3b0d1
  phase1_tag: upv-protocol-v1
  phase2_results_revision: 9e7ab0ac405f6e455736e07fe5c14e5f82360a4f
  phase3a_results_revision: 30c345731249df73b3fc7fdb7d8ca6b8bec3d04b
  v2_1_plan_revision: a14ecd77f5f1eb4a9fca50f7297f7aa5924b08d1
  public_evidence_addendum: manifests/upv_public_evidence_addendum_v1.json
  public_evidence_addendum_sha256: 737ab9870e96f483afb56f7025495f835f7ecfefdb37332010942eefa2f0e53a
  required_phase3a_decision: insufficient_metadata_absolute_rsrp_not_identified
  phase2_and_phase3a_snapshots_must_remain_unchanged: true

model:
  family: TDL_B
  topology:
    gnb_count: 1
    ue_count: 1
    ue_mobility: stationary

upv_units:
  primary:
    source_path: Test_2/Test_2_ASUS.csv
    device: ASUS
    interpretation: timestamp_gps_corrected
    role: primary_calibration_and_locked_spatial_validation
    region_assignment: frozen_reference_route_bins
    affects_preprocessing: true
    affects_primary_ranking: true
  filename_sensitivity:
    source_path: Test_1/Test_1_Asus.csv
    device: ASUS
    interpretation: original_filenames
    route_corrected_test_id: 1
    trim_last_seconds: 0
    role: scenario_interpretation_sensitivity_only
    region_assignment: nearest_reference_gps_with_matching_direction_sector
    affects_preprocessing: false
    affects_primary_ranking: false
  s25_robustness:
    source_path: Test_1/Test_1_S25.csv
    device: S25
    interpretation: original_filename_device_sensitivity
    route_corrected_test_id: 1
    trim_last_seconds: 0
    role: device_robustness_sensitivity_only
    caveat: timestamp/GPS correction marks this handset inactive for corrected Test 1
    region_assignment: nearest_reference_gps_with_matching_direction_sector
    affects_preprocessing: false
    affects_primary_ranking: false
  required_roles:
    - calibration
    - spatial_validation_1
    - spatial_validation_2
    - spatial_validation_3
    - spatial_validation_4
  primary_bin_size_m: 15
  required_complete_columns:
    - rsrp_dbm
    - sinr_db
    - seconds_of_day
    - longitude_deg
    - latitude_deg

region_transfer:
  coordinate_method: local_equirectangular_metres
  direction_match: exact_eight_sector_label
  maximum_nearest_reference_distance_m: 7.5
  minimum_raw_rows_per_region: 12
  minimum_transferred_fraction_per_region: 0.50
  fail_action: omit_invalid_sensitivity_unit_and_report_fail_closed

targets:
  - name: relative_RSRP
    order: 1
    upv_column: rsrp_dbm
    rfsim_column: ss_rsrp_dbm
    transform: subtract_within_unit_median_after_one_second_aggregation
    scale_location: offset_invariant_distribution_shape
    permitted_claim: within-unit relative-RSRP shape support
    prohibited_inference: physical_propagation_loss
  - name: SINR
    order: 2
    upv_column: sinr_db
    rfsim_column: ss_sinr_db
    transform: none
    scale_location: empirical_device_conditioned_distribution
    permitted_claim: empirical SINR distribution support
    prohibited_inference: absolute_noise_power

missing_value_policy: complete_case_drop_before_aggregation

temporal_aggregation:
  duration_seconds: 1.0
  statistic: median
  upv_origin: first_timestamp_within_each_source_x_locked_region
  rfsim_origin: fixed_analysis_window_start

rfsim_selection:
  observation_filename: ue_second_features.parquet
  execution_id_column: execution_id
  time_column: t_s
  analysis_window_start_seconds: 15.0
  analysis_window_end_seconds: 175.0
  analysis_window_end_inclusive: false
  model_column: dl_model_type
  ploss_column: dl_ploss
  noise_column: dl_noise_power_dB
  require_true:
    - channel_schedule_enabled
    - channel_state_success
    - channel_verified
  require_false:
    - channel_transition_partial
  minimum_complete_aggregated_rows: 12
  required_repetitions_per_state: 2

balanced_reference:
  fitted_separately_by_target: true
  sources: primary_UPV_calibration_region_plus_every_RFsim_execution
  rows_per_source: minimum_complete_aggregated_rows_across_sources
  row_selection: deterministic_evenly_spaced_time_index
  robust_center: median
  robust_scale: normalized_mad
  normalized_mad_factor: 1.4826
  zero_mad_fallback: iqr_divided_by_1.349
  validation_filename_sensitivity_and_S25_excluded_from_fit: true

kernel:
  name: rbf
  estimator: biased_mmd_squared_v_statistic
  bandwidth_source: per_target_balanced_reference_median_heuristic
  bandwidth_formula: sqrt_median_positive_squared_distance_divided_by_2
  posthoc_clipping: prohibited

bootstrap:
  rule: circular_moving_block_with_fixed_target_length
  block_length_aggregated_rows: 3
  repetitions: 1000
  confidence_level: 0.95
  seed: 20260826
  interpretation: traversal_conditional_not_between_execution
  affects_support_decision: false

support_rules:
  repeatability_threshold_quantile: 0.90
  support_rule: candidate_mean_execution_MMD_not_above_same_target_RFsim_repeatability_threshold
  primary_ranking: separate_by_target_on_ASUS_calibration_region_only
  validation_rule: evaluate_primary_best_candidate_without_refitting_or_reranking
  cross_target_intersection: descriptive_only_not_a_joint_posterior
  boundary_rule: primary_best_candidate_at_minimum_or_maximum_observed_control

decision_rules:
  relative_RSRP_unsupported_SINR_supported: revise_fading_or_channel_variability_model
  relative_RSRP_supported_SINR_boundary_unsupported: evaluate_effective_noise_control_extension
  both_supported_with_common_candidate: plan_independent_repetitions_before_any_inference
  both_supported_without_common_candidate: retain_separate_metric_support_and_revise_control_design
  neither_supported: revise_simulator_discrepancy_model

claim_limits:
  absolute_rsrp_calibration: prohibited
  physical_ploss_inference: prohibited
  absolute_noise_power_calibration: prohibited
  joint_identifiability: prohibited
  abc: prohibited
  existing_two_execution_intervals: traversal_conditional_only

reservation:
  request_now: false
  preparation_lead_time_minutes: 30
  gate_state: closed
  parser_requirement: implemented_and_validated_on_real_pinned_revision_logs
  minimum_independent_executions_per_selected_state: 3
  preferred_independent_executions_per_selected_state: 5
