[project]
name = "rfsim-realism"
version = "0.1.0"
description = "Measurement-informed calibration and validation for OAI RFsim scenarios"
requires-python = ">=3.11,<3.15"
dependencies = [
  "ipykernel>=6.29,<8",
  "matplotlib>=3.9,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<23",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
rfsim-realism = "rfsim_realism.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]
